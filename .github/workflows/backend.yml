name: Backend Tests

on:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run tests
        working-directory: backend
        run: uv run pytest -v
